# Roda sempre que um projeto é enviado para a pasta projetos/ (ou manualmente).
# Requer o segredo ANTHROPIC_API_KEY em Settings → Secrets and variables → Actions.
name: Levantamento de materiais e serviços

on:
  push:
    paths:
      - "projetos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cotacao
  cancel-in-progress: false

jobs:
  levantamento:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Processar projetos novos ou alterados
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m cotaai novos

      - name: Salvar planilhas no repositório
        if: always()
        run: |
          git config user.name "cota-ai[bot]"
          git config user.email "cota-ai@users.noreply.github.com"
          git add cotacoes/
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Levantamento gerado pela IA [skip ci]"
            git push
          fi

      - name: Disponibilizar planilhas para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: levantamentos
          path: cotacoes/**/*.xlsx
          if-no-files-found: ignore
